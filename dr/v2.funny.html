<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020204">
<title>Приглашение · вход</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#020204;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:360px}
.lbl{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#6f7787;text-align:center;margin-bottom:12px}
h1{margin:0 0 6px;font-size:25px;line-height:1.15;text-align:center;font-weight:800}
p{margin:0 0 20px;font-size:14px;line-height:1.5;color:#98a1ad;text-align:center}
form{display:flex;flex-direction:column;gap:10px}
input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:#10141a;color:#fff;font-size:16px;outline:none}
input:focus{border-color:#4ade80}
button{width:100%;padding:14px 16px;border-radius:12px;border:0;background:#4ade80;color:#04140a;font-size:16px;font-weight:800;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{min-height:20px;margin-top:12px;text-align:center;font-size:13px;color:#f472b6}
</style>
</head>
<body>
<div class="card">
  <div class="lbl">Приватная страница</div>
  <h1>Вход по паролю</h1>
  <p>Введи пароль, чтобы открыть приглашение</p>
  <form id="gf">
    <input id="gp" type="password" placeholder="Пароль" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="gb" type="submit">Открыть</button>
  </form>
  <div class="err" id="ge"></div>
</div>
<script>
(function (G) {
  'use strict';

  function hex2bytes(h) {
    var n = Math.floor(h.length / 2), a = new Uint8Array(n);
    for (var i = 0; i < n; i++) a[i] = parseInt(h.substr(i * 2, 2), 16);
    return a;
  }
  function bytes2hex(a) {
    var s = '';
    for (var i = 0; i < a.length; i++) s += (a[i] < 16 ? '0' : '') + a[i].toString(16);
    return s;
  }
  function str2bytes(s) {
    var a = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i) & 255;
    return a;
  }
  function bytes2str(a) {
    var s = '', CH = 4096;
    for (var i = 0; i < a.length; i += CH) {
      s += String.fromCharCode.apply(null, a.subarray(i, Math.min(i + CH, a.length)));
    }
    return s;
  }
  function rightRotate(v, a) { return (v >>> a) | (v << (32 - a)); }

  function sha256(ascii) {
    var mathPow = Math.pow, maxWord = mathPow(2, 32), i, j;
    var result = '', words = [], asciiBitLength = ascii.length * 8;
    var hash = sha256.h = sha256.h || [], k = sha256.k = sha256.k || [];
    var primeCounter = k.length, isComposite = {};
    for (var candidate = 2; primeCounter < 64; candidate++) {
      if (!isComposite[candidate]) {
        for (i = 0; i < 313; i += candidate) { isComposite[i] = candidate; }
        hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
        k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
      }
    }
    ascii += '\x80';
    while (ascii.length % 64 - 56) ascii += '\x00';
    for (i = 0; i < ascii.length; i++) {
      j = ascii.charCodeAt(i);
      if (j >> 8) return;
      words[i >> 2] |= j << ((3 - i) % 4) * 8;
    }
    words[words.length] = ((asciiBitLength / maxWord) | 0);
    words[words.length] = (asciiBitLength);
    for (j = 0; j < words.length;) {
      var w = words.slice(j, j += 16), oldHash = hash;
      hash = hash.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
        var temp1 = hash[7]
          + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
          + ((e & hash[5]) ^ ((~e) & hash[6]))
          + k[i]
          + (w[i] = (i < 16) ? w[i] : (
              w[i - 16]
              + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
              + w[i - 7]
              + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
            ) | 0
          );
        var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
          + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(temp1 + temp2) | 0].concat(hash);
        hash[4] = (hash[4] + temp1) | 0;
      }
      for (i = 0; i < 8; i++) { hash[i] = (hash[i] + oldHash[i]) | 0; }
    }
    for (i = 0; i < 8; i++) {
      for (j = 3; j + 1; j--) {
        var b = (hash[i] >> (j * 8)) & 255;
        result += ((b < 16) ? 0 : '') + b.toString(16);
      }
    }
    return result;
  }
  function sha256b(str) { return hex2bytes(sha256(str)); }

  /* HMAC-SHA256 через чистый JS (без crypto.subtle — работает и по http) */
  function hmac(keyStr, msgStr) {
    var k = str2bytes(keyStr);
    if (k.length > 64) k = sha256b(keyStr);
    var ip = new Uint8Array(64), op = new Uint8Array(64);
    for (var i = 0; i < 64; i++) {
      var b = i < k.length ? k[i] : 0;
      ip[i] = b ^ 0x36;
      op[i] = b ^ 0x5c;
    }
    var inner = sha256b(bytes2str(ip) + msgStr);
    return sha256b(bytes2str(op) + bytes2str(inner));
  }

  function pbkdf2(pwStr, saltStr, iters, len) {
    var out = new Uint8Array(len), off = 0, block = 1;
    while (off < len) {
      var msg = saltStr + String.fromCharCode(0, 0, 0, block);
      var u = hmac(pwStr, msg), t = new Uint8Array(u);
      for (var i = 1; i < iters; i++) {
        u = hmac(pwStr, bytes2str(u));
        for (var j = 0; j < 32; j++) t[j] ^= u[j];
      }
      var take = Math.min(32, len - off);
      out.set(t.subarray(0, take), off);
      off += take; block++;
    }
    return out;
  }

  function keystream(key, len) {
    var blocks = Math.ceil(len / 32), ks = new Uint8Array(blocks * 32), keyStr = bytes2str(key);
    for (var b = 0; b < blocks; b++) {
      var ctr = String.fromCharCode((b >>> 24) & 255, (b >>> 16) & 255, (b >>> 8) & 255, b & 255);
      ks.set(sha256b(keyStr + ctr), b * 32);
    }
    return ks;
  }

  function b64ToBytes(s) {
    var bin;
    if (typeof atob !== 'undefined') bin = atob(s);
    else bin = Buffer.from(s, 'base64').toString('binary');
    return str2bytes(bin);
  }
  function utf8Encode(s) { return unescape(encodeURIComponent(s)); }
  function utf8Decode(bytes) {
    var s = bytes2str(bytes);
    try { return decodeURIComponent(escape(s)); } catch (e) { return s; }
  }

  /* meta = {salt, iters, tag, data}; returns html string или null при неверном пароле */
  function sealDecrypt(meta, password) {
    var saltStr = bytes2str(hex2bytes(meta.salt));
    var dk = pbkdf2(utf8Encode(password), saltStr, meta.iters | 0, 64);
    var ct = b64ToBytes(meta.data);
    var tag = bytes2hex(hmac(bytes2str(dk.subarray(32, 64)), bytes2str(ct)));
    if (tag !== String(meta.tag).toLowerCase()) return null;
    var ks = keystream(dk.subarray(0, 32), ct.length);
    var out = new Uint8Array(ct.length);
    for (var i = 0; i < ct.length; i++) out[i] = ct[i] ^ ks[i];
    return utf8Decode(out);
  }

  G.GateCrypto = { sha256: sha256, hmac: hmac, pbkdf2: pbkdf2, sealDecrypt: sealDecrypt };
  if (typeof module !== 'undefined' && module.exports) module.exports = G.GateCrypto;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function(){
  "use strict";
  var META_URL = 'https://xxauwkymufehmoprmhay.supabase.co/storage/v1/object/public/gate/v2-content.json';
  var CACHE = 'v2-plain-v1';
  var form = document.getElementById('gf');
  var input = document.getElementById('gp');
  var btn = document.getElementById('gb');
  var errEl = document.getElementById('ge');
  var meta = null;

  function render(html){
    document.open();
    document.write(html);
    document.close();
  }

  try { var c = sessionStorage.getItem(CACHE); if (c) { render(c); return; } } catch(e) {}

  function loadMeta(){
    return fetch(META_URL + '?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(j){ meta = j; });
  }
  loadMeta().catch(function(){ errEl.textContent = 'Нет связи с сервером — обнови страницу'; });

  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    if (btn.disabled) return;
    var v = input.value;
    if (!v) { input.focus(); return; }
    if (!meta) {
      errEl.textContent = 'Жду ответ сервера…';
      loadMeta().then(function(){ errEl.textContent = 'Попробуй ещё раз'; })
                .catch(function(){ errEl.textContent = 'Нет связи с сервером'; });
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Проверяю…';
    errEl.textContent = '';
    setTimeout(function(){
      var html = null;
      try { html = GateCrypto.sealDecrypt(meta, v); } catch(e) { html = null; }
      if (html) {
        try { sessionStorage.setItem(CACHE, html); } catch(e) {}
        render(html);
      } else {
        btn.disabled = false;
        btn.textContent = 'Открыть';
        errEl.textContent = 'Неверный пароль';
        input.value = '';
        input.focus();
      }
    }, 30);
  });
  input.focus();
})();
</script>
</body>
</html>
